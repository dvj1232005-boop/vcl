<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đăng Ký Ca Làm | Quản Lý Lịch Trực</title>
<meta name="theme-color" content="#064e3b">
<!-- Tích hợp Google Font 'Inter' -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #dc2626;
    --primary-hover: #b91c1c;
    --primary-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    --secondary: #334155;
    --secondary-hover: #1e293b;
    --success: #10b981;
    --danger: #ef4444;
    --bg-gradient: linear-gradient(135deg, #450a0a 0%, #022c22 100%);
    --surface: rgba(255, 255, 255, 0.92);
    --surface-hover: rgba(255, 255, 255, 0.98);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --focus-ring: rgba(220, 38, 38, 0.15);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    padding: 50px 15px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hidden { display: none !important; }

  .container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    position: relative;
    z-index: 1;
  }

  /* Decorative Background Elements */
  body::before {
    content: ''; position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, transparent 70%);
    z-index: 0; pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    z-index: 0; pointer-events: none;
  }

  /* Cards with Premium Glassmorphism & Animation */
  .card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 36px 30px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.3);
    margin-bottom: 24px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(255, 255, 255, 0.6);
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .card:hover { background: var(--surface-hover); }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  h2 { margin: 0 0 6px; font-size: 28px; color: var(--text-main); font-weight: 800; text-align: center; letter-spacing: -0.8px; }
  .sub { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; font-weight: 500; text-align: center; }

  /* Premium Inputs & Selects */
  .input-wrapper { position: relative; margin-bottom: 20px; }
  .input-icon {
    position: absolute; left: 16px; top: 48px;
    color: #94a3b8; pointer-events: none; transition: color 0.3s;
  }
  
  input[type="text"], input[type="password"], select {
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    border: 2px solid transparent;
    font-size: 15px;
    background: #f1f5f9;
    color: var(--text-main);
    transition: all 0.3s ease;
    outline: none;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  input[type="text"] { padding-left: 48px; } /* Space for icon */
  
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 18px;
    appearance: none;
    cursor: pointer;
  }

  input:focus, select:focus {
    background: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
    transform: translateY(-1px);
  }
  input:focus + .input-icon { color: var(--primary); }

  /* Passcode Style for Manager */
  #pin {
    text-align: center;
    font-size: 24px;
    letter-spacing: 8px;
    padding-left: 20px; /* reset icon space */
    font-weight: 800;
  }

  /* Buttons */
  button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 18px;
    background: var(--primary-gradient);
    color: white;
    font-size: 16.5px;
    font-weight: 700;
    margin-top: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy hover */
    box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: all 0.5s;
  }
  button:hover:not(:disabled) { 
    transform: translateY(-3px) scale(1.01); 
    box-shadow: 0 15px 25px -5px rgba(220, 38, 38, 0.5); 
  }
  button:hover:not(:disabled)::after { left: 100%; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; opacity: 0.9; color: #64748b; transform: none; }
  
  button.secondary {
    background: white;
    color: var(--secondary);
    border: 2px solid var(--border-color);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  }
  button.secondary:hover { background: #f8fafc; border-color: #cbd5e1; box-shadow: 0 8px 15px -3px rgba(0,0,0,0.08); }

  button.danger {
    background: #fef2f2;
    color: var(--danger);
    border: 2px solid #fecaca;
    box-shadow: none;
  }
  button.danger:hover { background: #fee2e2; border-color: #fca5a5; }

  /* Form Grid */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full-width { grid-column: span 2; }
  .day-label { font-weight: 700; font-size: 14px; margin-bottom: 10px; margin-left: 6px; color: var(--secondary); display: block; }

  /* Badges & Pills */
  .shiftBox { background: #f8fafc; border-radius: 20px; padding: 20px; margin: 12px 0; border: 1px solid var(--border-color); transition: all 0.2s; }
  .shiftBox:hover { border-color: #cbd5e1; box-shadow: 0 8px 16px rgba(0,0,0,0.04); transform: translateY(-2px); }
  .shiftBox b { color: var(--primary); font-size: 17px; font-weight: 800; }
  .badge {
    display: inline-block; background: #14532d; color: white; padding: 6px 14px;
    border-radius: 999px; font-size: 13px; font-weight: 600; margin: 8px 6px 0 0;
    box-shadow: 0 2px 4px rgba(20, 83, 45, 0.2); letter-spacing: 0.3px;
  }

  /* Status Badge with Pulsing Dot */
  .status-badge {
    font-weight: 600; text-align: center; padding: 12px 16px; border-radius: 16px; 
    background: #f1f5f9; display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-bottom: 20px; font-size: 14px; border: 1px solid transparent; transition: all 0.3s;
  }
  .pulse-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 2s infinite;
  }
  .pulse-dot.danger { background: var(--danger); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(var(--rgb-color), 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(var(--rgb-color), 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(var(--rgb-color), 0); }
  }

  /* Countdown Card */
  .countdown {
    margin: 24px 0; padding: 24px 16px; border-radius: 20px;
    background: linear-gradient(to right, #ecfdf5, #f0fdf4);
    text-align: center; border: 2px solid #a7f3d0;
    box-shadow: inset 0 2px 10px rgba(16, 185, 129, 0.05);
  }
  .cd-label { font-size: 13px; font-weight: 800; color: #047857; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #countdownTime { font-size: 28px; font-weight: 800; color: #065f46; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
  
  .countdown.danger { background: linear-gradient(to right, #fef2f2, #fff1f2); border-color: #fecaca; }
  .countdown.danger .cd-label { color: #991b1b; }
  .countdown.danger #countdownTime { color: #dc2626; }

  /* Custom Scrollbar & Table */
  .table-responsive { width: 100%; overflow-x: auto; margin-top: 16px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
  .table-responsive::-webkit-scrollbar { height: 8px; }
  .table-responsive::-webkit-scrollbar-track { background: #f1f5f9; }
  .table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  
  .styled-table { width: 100%; border-collapse: collapse; font-size: 14.5px; text-align: left; background: white; }
  .styled-table thead tr { background-color: #f8fafc; color: var(--secondary); text-align: center; font-weight: 700; border-bottom: 2px solid var(--border-color); }
  .styled-table th, .styled-table td { padding: 18px 16px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
  .styled-table tbody tr { transition: background 0.2s; }
  .styled-table tbody tr:hover { background-color: #f1f5f9; }
  .styled-table td.text-center { text-align: center; font-weight: 700; color: var(--primary); }

  footer { text-align: center; margin-top: auto; padding-top: 24px; font-size: 14px; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.5px; z-index: 1; }

  /* ================= iOS Style Toast ================= */
  .toast-container {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; flex-direction: column; gap: 10px; align-items: center;
    pointer-events: none;
  }
  .toast {
    background: rgba(15, 23, 42, 0.95); color: white; backdrop-filter: blur(10px);
    padding: 16px 24px; border-radius: 100px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 12px;
    transform: translateY(-150%) scale(0.9); opacity: 0;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  .toast.show { transform: translateY(0) scale(1); opacity: 1; }
  .toast.success .t-icon { color: #34d399; }
  .toast.error .t-icon { color: #f87171; }
  .toast.warning .t-icon { color: #fbbf24; }

  /* Custom Loading Spinner */
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>

<body>

<div id="toastContainer" class="toast-container"></div>

<div class="container" id="app">
  <div class="card">
    <h2>Đăng Ký Ca Làm</h2>
    <div class="sub">Lịch làm việc tuần hiện tại</div>
    
    <div id="lockStatus" class="status-badge">
      <span class="pulse-dot" style="--rgb-color: 16, 185, 129;"></span>
      <span>Đang tải trạng thái...</span>
    </div>

    <div id="countdownCard" class="countdown">
      <div class="cd-label">⏳ Thời gian còn lại</div>
      <div id="countdownTime">-- : -- : -- : --</div>
    </div>

    <div class="input-wrapper">
      <label class="day-label" for="name">Họ và Tên</label>
      <input type="text" id="name" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="off">
      <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>

    <div id="form" class="form-grid"></div>

    <button id="submitBtn" style="margin-top: 24px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      Xác nhận đăng ký
    </button>
    
    <button id="managerBtn" class="secondary" style="margin-top: 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Khu vực Quản lý
    </button>
  </div>

  <div class="card hidden" id="managerBox">
    <h2>Trang Quản Trị</h2>
    <div class="sub">Dành cho Admin phê duyệt & tổng hợp</div>

    <div class="input-wrapper" style="margin-top: 24px;">
      <label class="day-label" style="text-align: center;">Mã PIN Bảo Mật</label>
      <input id="pin" type="password" placeholder="••••" maxlength="4">
    </div>
    <button id="loginManager">Đăng nhập khoá vòng</button>

    <div id="summary" style="margin-top: 32px;"></div>
    <div id="excelTable"></div>

    <div class="form-grid" style="margin-top: 40px; border-top: 2px dashed var(--border-color); padding-top: 32px;">
      <button id="unlockBtn" class="secondary" style="margin-top: 0;">🔓 Mở đăng ký</button>
      <button id="lockBtn" class="secondary" style="margin-top: 0;">🔒 Khóa đăng ký</button>
    </div>

    <button id="clearBtn" class="danger" style="margin-top: 16px;">
      🗑️ Làm sạch lịch tuần này
    </button>
  </div>

  <footer>© 2026 Hệ Thống Quản Lý Ca Làm<br>Developed by Đào Đăng Tùng</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, onValue }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCK6yfVr9VBMGwhbvYMXkJqMoRjo4Om2LM",
  databaseURL:"https://an-quy-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

const DAYS=["T2","T3","T4","T5","T6","T7","CN"];
const SHIFTS=["C1","C2","C3","F1","F2","2C(C1+C2)","2C(C2+C3)"];

/* ================= iOS Style Toast Notification ================= */
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  let iconHtml = '';
  if(type === 'success') iconHtml = '<svg class="t-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
  else if(type === 'error') iconHtml = '<svg class="t-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
  else iconHtml = '<svg class="t-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
  
  toast.innerHTML = `${iconHtml} <span>${message}</span>`;
  container.appendChild(toast);
  
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 500);
  }, 3500);
}

/* ================= LOCK STATUS LOGIC ================= */
let manualLock = null;

onValue(ref(db, "settings/lock"), (snap) => {
  manualLock = snap.exists() ? snap.val() : null;
  updateStatus();
  updateCountdown();
});

function isRegistrationLocked(){
  if(manualLock === true) return true;
  if(manualLock === false) return false;
  const n=new Date();
  const d=n.getDay(), h=n.getHours(), m=n.getMinutes();
  if(d===5 && (h>20 || (h===20 && m>=0))) return true;
  if(d===6 || d===0) return true;
  return false;
}

const lockStatus=document.getElementById("lockStatus");

function updateStatus(){
  const isLocked = manualLock === true || (manualLock !== false && isRegistrationLocked());
  
  if(isLocked) {
    lockStatus.innerHTML=`<span class="pulse-dot danger" style="--rgb-color: 239, 68, 68;"></span> <span style='color:#dc2626'>${manualLock === true ? 'Hệ thống đã bị khóa thủ công' : 'Đang khóa • Mở lại Thứ 2'}</span>`;
    lockStatus.style.background = "#fef2f2";
    lockStatus.style.borderColor = "#fecaca";
  } else {
    lockStatus.innerHTML=`<span class="pulse-dot" style="--rgb-color: 16, 185, 129;"></span> <span style='color:#15803d'>${manualLock === false ? 'Đang mở (Quản lý cấp quyền)' : 'Đang mở • Khóa lúc 20:00 Thứ 6'}</span>`;
    lockStatus.style.background = "#ecfdf5";
    lockStatus.style.borderColor = "#a7f3d0";
  }
}

/* ================= COUNTDOWN LOGIC ================= */
const cdCard=document.getElementById("countdownCard");
const cdTime=document.getElementById("countdownTime");
const submitBtn=document.getElementById("submitBtn");

function getLockTime(){
  const now = new Date();
  let diff = 5 - now.getDay();
  if (diff < 0) diff += 7; 
  const lock = new Date(now);
  lock.setDate(now.getDate() + diff);
  lock.setHours(20,0,0,0);
  return lock;
}

function updateCountdown(){
  const now=new Date();
  const diff=getLockTime()-now;

  if(isRegistrationLocked()){
    cdTime.innerText="ĐÃ ĐÓNG";
    cdCard.className="countdown danger";
    submitBtn.disabled=true;
    return;
  }

  if(diff<=0){
    cdTime.innerText="HẾT THỜI GIAN";
    cdCard.className="countdown";
    cdCard.style.borderColor = "#fcd34d";
    cdCard.style.background = "linear-gradient(to right, #fffbeb, #fef3c7)";
    cdTime.style.color = "#d97706";
    submitBtn.disabled=false;
    return;
  }

  const d=Math.floor(diff/(1000*60*60*24));
  const h=Math.floor(diff/(1000*60*60))%24;
  const m=Math.floor(diff/(1000*60))%60;
  const s=Math.floor(diff/1000)%60;

  cdTime.innerText=`${d} ngày : ${h.toString().padStart(2,"0")} : ${m.toString().padStart(2,"0")} : ${s.toString().padStart(2,"0")}`;
  cdCard.className="countdown";
  cdCard.style = "";
  submitBtn.disabled=false;
}
setInterval(updateCountdown,1000);
updateCountdown();

/* ================= FORM RENDER ================= */
const form=document.getElementById("form");
DAYS.forEach((d, index) => {
  const fullWidthClass = (index === 6) ? "full-width" : "";
  form.innerHTML+=`
    <div class="form-group ${fullWidthClass}">
      <label class="day-label" for="${d}">${d === 'CN' ? 'Chủ Nhật' : 'Thứ ' + d.charAt(1)}</label>
      <div class="input-wrapper" style="margin-bottom:0">
        <select id="${d}">
          <option value="">Nghỉ</option>
          ${SHIFTS.map(s=>`<option value="${s}">${s}</option>`).join("")}
        </select>
      </div>
    </div>
  `;
});

/* ================= SUBMIT ACTION ================= */
document.getElementById("submitBtn").onclick=async()=>{
  const ten=document.getElementById("name").value.trim();
  if(!ten) {
    document.getElementById("name").focus();
    return showToast("Vui lòng nhập họ và tên của bạn!", "warning");
  }

  if(isRegistrationLocked()) return showToast("Hệ thống hiện tại đang khóa đăng ký!", "error");

  const lich={};
  DAYS.forEach(d=>{ const v=document.getElementById(d).value; if(v) lich[d]=v; });

  if(!Object.keys(lich).length) return showToast("Bạn chưa chọn ca làm nào cho tuần này!", "warning");

  submitBtn.innerHTML = `<svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Đang xử lý...`;
  submitBtn.disabled = true;

  try {
    await set(ref(db,"dangKy/"+ten),{lich});
    showToast("Đăng ký thành công! Chúc bạn tuần mới năng lượng 🚀", "success");
    document.getElementById("name").value = "";
    DAYS.forEach(d => document.getElementById(d).value = "");
  } catch(e) {
    showToast("Lỗi kết nối: " + e.message, "error");

    submitBtn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Xác nhận đăng ký`;
    submitBtn.disabled = false;
  }
};

/* ================= MANAGER ACTIONS ================= */
document.getElementById("managerBtn").onclick=()=>{
  const mgrBox = document.getElementById("managerBox");
  mgrBox.classList.toggle("hidden");
  if(!mgrBox.classList.contains("hidden")) mgrBox.scrollIntoView({ behavior: "smooth" });

document.getElementById("loginManager").onclick=async()=>{
  if(document.getElementById("pin").value!=="2005") return showToast("Mã PIN không chính xác!", "error");

  const summary=document.getElementById("summary");
  const excel=document.getElementById("excelTable");

  summary.innerHTML="<p style='text-align:center; color: var(--secondary); font-weight: 500;'><svg class='spinner' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='2' x2='12' y2='6'></line><line x1='12' y1='18' x2='12' y2='22'></line><line x1='4.93' y1='4.93' x2='7.76' y2='7.76'></line><line x1='16.24' y1='16.24' x2='19.07' y2='19.07'></line><line x1='2' y1='12' x2='6' y2='12'></line><line x1='18' y1='12' x2='22' y2='12'></line><line x1='4.93' y1='19.07' x2='7.76' y2='16.24'></line><line x1='16.24' y1='7.76' x2='19.07' y2='4.93'></line></svg> Đang đồng bộ...</p>";
  excel.innerHTML="";

  try {
    const snap=await get(ref(db,"dangKy"));
    if(!snap.exists()){
      summary.innerHTML="<div style='text-align:center; padding: 40px 20px; background: #f8fafc; border-radius: 20px; border: 2px dashed #cbd5e1;'><span style='font-size: 36px;'>📭</span><br><br><b style='font-size: 18px;'>Trống rỗng</b><br><span style='color: #64748b; font-size: 15px; margin-top:8px; display:inline-block'>Chưa có nhân viên nào đăng ký.</span></div>";
      return;
    }

    const data = snap.val();
    const sum={};

    Object.entries(data).forEach(([ten,obj])=>{
      Object.entries(obj.lich||{}).forEach(([d,c])=>{
        sum[d]??={}; sum[d][c]??=[]; sum[d][c].push(ten);
      });
    });

    summary.innerHTML = "<h3 style='margin-bottom: 24px; font-size: 22px; color: var(--text-main); font-weight: 800;'>📋 Thống kê theo ngày</h3>";
    DAYS.forEach(day=>{
      if(!sum[day]) return;
      let dayHTML = `<h4 style="margin: 32px 0 16px; color: var(--secondary); border-bottom: 2px solid var(--border-color); padding-bottom: 12px; font-size: 18px; font-weight: 800;">${day === 'CN' ? 'Chủ Nhật' : 'Thứ ' + day.charAt(1)}</h4>`;
      
      SHIFTS.forEach(shift=>{
        if(!sum[day][shift]) return;
        dayHTML += `
          <div class="shiftBox">
            <b>Ca ${shift}</b><br>
            <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px;">
              ${sum[day][shift].map(n=>`<span class="badge">${n}</span>`).join("")}
            </div>
          </div>
        `;
      });
      summary.innerHTML += dayHTML;
    });

    renderExcelTable(data);
    showToast("Tải dữ liệu thành công!", "success");
    document.getElementById("pin").value = "";
  } catch(e) {
    showToast("Lỗi đồng bộ: " + e.message, "error");
  }
};

/* EXCEL TABLE */
function renderExcelTable(data){
  const container=document.getElementById("excelTable");
  let tableHTML = `
    <h3 style="margin-top: 50px; margin-bottom: 24px; font-size: 22px; font-weight: 800;">📊 Bảng Tổng Hợp Lịch</h3>
    <div class="table-responsive">
      <table class="styled-table">
        <thead>
          <tr>
            <th style="text-align: left; position: sticky; left: 0; background: #f8fafc; z-index: 10;">Họ & Tên</th>
            ${DAYS.map(d => `<th>${d}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
  `;
  Object.entries(data).forEach(([ten,obj])=>{
    tableHTML += `<tr><td style="position: sticky; left: 0; background: inherit; font-weight: 700; box-shadow: inset -2px 0 0 var(--border-color);">${ten}</td>`;
    DAYS.forEach(day => {
       const shift = obj.lich?.[day] || '-';
       tableHTML += `<td class="text-center">${shift}</td>`;
    });
    tableHTML += `</tr>`;
  });
  tableHTML += `</tbody></table></div>`;
  container.innerHTML = tableHTML;
}

/* LOCK / UNLOCK */
document.getElementById("unlockBtn").onclick=async()=>{
  if(!confirm("MỞ hệ thống thủ công?")) return;
  await set(ref(db,"settings/lock"),false);
  showToast("Đã MỞ khóa hệ thống!", "success");
};

document.getElementById("lockBtn").onclick=async()=>{
  if(!confirm("KHÓA hệ thống thủ công?")) return;
  await set(ref(db,"settings/lock"),true);
  showToast("Đã KHÓA hệ thống!", "warning");
};

/* CLEAR */
document.getElementById("clearBtn").onclick=async()=>{
  if(confirm("⚠️ CẢNH BÁO: Xóa sạch dữ liệu đăng ký tuần này?\nHành động này KHÔNG THỂ KHÔI PHỤC!")){
    await remove(ref(db,"dangKy"));
    showToast("Đã xóa sạch dữ liệu!", "success");
    document.getElementById("summary").innerHTML = "";
    document.getElementById("excelTable").innerHTML = "";
  }
};
</script>
