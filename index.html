<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng ký ca làm</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,#064e3b,#022c22);
}

.container{max-width:420px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:22px;
  box-shadow:0 30px 60px rgba(0,0,0,.3);
}

input,select{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  border:1px solid #e2e8f0;
  background:#f8fafc;
}
input:focus,select:focus{
  outline:none;
  border-color:#22c55e;
  box-shadow:0 0 0 2px #bbf7d0;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#16a34a;
  color:white;
  font-weight:600;
  margin-top:14px;
  transition:0.25s;
}
button:hover{transform:translateY(-2px)}

.day{
  font-weight:700;
  margin-top:16px;
  padding:8px 12px;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}

.shiftBox{
  background:#f1f5f9;
  border-radius:14px;
  padding:10px;
  margin:8px 0;
}

.badge{
  display:inline-block;
  background:#16a34a;
  color:white;
  padding:6px 10px;
  border-radius:999px;
  margin:4px;
}

.hidden{display:none}

/* keypad */
#keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.key{
  height:60px;
  border-radius:50%;
  font-size:18px;
  background:#e2e8f0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Đăng ký ca làm</h2>

<input id="name" placeholder="Nhập tên">

<div id="form"></div>

<button id="submitBtn">Xác nhận</button>
<button id="managerBtn">🔐 Quản lý</button>
</div>

<div class="card hidden" id="managerBox">
<h2>Quản lý</h2>

<div id="pinDisplay">••••</div>
<div id="keypad"></div>

<div id="summary"></div>
<button id="clearBtn">Xóa dữ liệu</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, get, remove }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCK6yfVr9VBMGwhbvYMXkJqMoRjo4Om2LM",
  databaseURL:"https://an-quy-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

const DAYS=["T2","T3","T4","T5","T6","T7","CN"];
const SHIFTS=["C1","C2","C3","F1","F2"];

const form=document.getElementById("form");

DAYS.forEach(d=>{
  form.innerHTML+=`
    <div class="day">${d}</div>
    <select id="${d}">
      <option value="">Không đăng ký</option>
      ${SHIFTS.map(s=>`<option>${s}</option>`).join("")}
    </select>
  `;
});

/* SUBMIT */
document.getElementById("submitBtn").onclick=async()=>{
  const ten=document.getElementById("name").value.trim();
  if(!ten) return alert("Nhập tên");

  const lich={};
  DAYS.forEach(d=>{
    const v=document.getElementById(d).value;
    if(v) lich[d]=v;
  });

  if(!Object.keys(lich).length) return alert("Chưa chọn ca");

  // 🔥 GOM 1 NGUỒN
  await set(ref(db,"dangKy/"+ten),{lich});

  alert("Đã lưu");
};

/* MANAGER */
document.getElementById("managerBtn").onclick=()=>{
  document.getElementById("managerBox").classList.remove("hidden");
};

/* KEYPAD */
let pin="";
const display=document.getElementById("pinDisplay");
const keypad=document.getElementById("keypad");

[1,2,3,4,5,6,7,8,9,"","0","⌫"].forEach(k=>{
  const b=document.createElement("button");
  b.textContent=k;
  b.className="key";

  b.onclick=()=>{
    if(k==="⌫") pin=pin.slice(0,-1);
    else if(k!==""){
      if(pin.length<4) pin+=k;
    }

    display.textContent="•".repeat(pin.length);

    if(pin.length===4){
      if(pin==="2005"){
        loadData();
      }else{
        alert("Sai PIN");
      }
      pin="";
      display.textContent="••••";
    }
  };

  keypad.appendChild(b);
});

/* LOAD DATA */
async function loadData(){
  const snap=await get(ref(db,"dangKy"));
  if(!snap.exists()) return;

  const data=snap.val();
  const summary=document.getElementById("summary");
  summary.innerHTML="";

  const sum={};

  Object.entries(data).forEach(([ten,obj])=>{
    Object.entries(obj.lich||{}).forEach(([d,c])=>{
      sum[d]??={};
      sum[d][c]??=[];
      sum[d][c].push(ten);
    });
  });

  DAYS.forEach(day=>{
    if(!sum[day]) return;

    summary.innerHTML+=`<div class="day">${day}</div>`;

    SHIFTS.forEach(s=>{
      if(!sum[day][s]) return;

      summary.innerHTML+=`
        <div class="shiftBox">
          <b>${s}</b><br>
          ${sum[day][s].map(n=>`<span class="badge">${n}</span>`).join("")}
        </div>
      `;
    });
  });
}

/* CLEAR */
document.getElementById("clearBtn").onclick=async()=>{
  if(confirm("Xóa hết?")){
    await remove(ref(db,"dangKy"));
    location.reload();
  }
};
</script>

</body>
</html>
