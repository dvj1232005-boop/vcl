<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Quy Chế & Đền Đô</title>

<style>
/* giữ nguyên toàn bộ CSS */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,#7f1d1d,#064e3b);
  min-height:100vh;
}
.hidden{display:none}
.container{max-width:420px;margin:auto;padding:20px}
.card{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
}
h2{margin:0 0 6px}
.sub{font-size:13px;color:#555}
input,select{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#b91c1c;
  color:white;
  font-weight:600;
  margin-top:14px;
}
button.secondary{background:#334155}
.day{font-weight:700;margin-top:14px}
.shiftBox{
  background:#f1f5f9;
  border-radius:14px;
  padding:10px;
  margin:8px 0;
}
.badge{
  display:inline-block;
  background:#14532d;
  color:white;
  padding:6px 10px;
  border-radius:999px;
  margin:4px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h2>Đăng ký ca làm</h2>

    <input id="name" placeholder="Nhập tên nhân viên">

    <!-- ❌ ĐÃ XÓA SELECT CƠ SỞ -->

    <div id="form"></div>

    <button id="submitBtn">Xác nhận đăng ký</button>
    <button id="managerBtn" class="secondary">🔐 Quản lý</button>
  </div>

  <div class="card hidden" id="managerBox">
    <h2>Tổng hợp</h2>

    <input id="pin" type="password" placeholder="Nhập mã PIN">
    <button id="loginManager">Đăng nhập</button>

    <div id="summary"></div>
    <div id="excelTable"></div>

    <button id="clearBtn">Xóa dữ liệu</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, get, remove }
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyCK6yfVr9VBMGwhbvYMXkJqMoRjo4Om2LM",
  databaseURL:"https://an-quy-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

const DAYS=["T2","T3","T4","T5","T6","T7","CN"];
const SHIFTS=["C1","C2","C3","F1","F2","2C(C1+C2)","2C(C2+C3)"];

/* FORM */
const form=document.getElementById("form");
DAYS.forEach(d=>{
  form.innerHTML+=`
    <div class="day">${d}</div>
    <select id="${d}">
      <option value="">Không đăng ký</option>
      ${SHIFTS.map(s=>`<option>${s}</option>`).join("")}
    </select>
  `;
});

/* SUBMIT - GOM 1 NGUỒN */
document.getElementById("submitBtn").onclick=async()=>{
  const ten=document.getElementById("name").value.trim();
  if(!ten) return alert("Nhập tên");

  const lich={};
  DAYS.forEach(d=>{
    const v=document.getElementById(d).value;
    if(v) lich[d]=v;
  });

  if(!Object.keys(lich).length) return alert("Chưa chọn ca");

  await set(ref(db,"dangKy/"+ten),{lich});

  alert("Đã lưu");
};

/* MANAGER */
document.getElementById("managerBtn").onclick=()=>{
  document.getElementById("managerBox").classList.remove("hidden");
};

document.getElementById("loginManager").onclick=async()=>{
  if(document.getElementById("pin").value!=="2005")
    return alert("Sai PIN");

  const snap=await get(ref(db,"dangKy"));
  if(!snap.exists()) return;

  const data=snap.val();
  const summary=document.getElementById("summary");
  summary.innerHTML="";

  const sum={};

  Object.entries(data).forEach(([ten,obj])=>{
    Object.entries(obj.lich||{}).forEach(([d,c])=>{
      sum[d]??={};
      sum[d][c]??=[];
      sum[d][c].push(ten);
    });
  });

  DAYS.forEach(day=>{
    if(!sum[day]) return;

    summary.innerHTML+=`<div class="day">${day}</div>`;

    SHIFTS.forEach(s=>{
      if(!sum[day][s]) return;

      summary.innerHTML+=`
        <div class="shiftBox">
          <b>${s}</b><br>
          ${sum[day][s].map(n=>`<span class="badge">${n}</span>`).join("")}
        </div>
      `;
    });
  });

  renderExcel(data);
};

/* EXCEL GỘP */
function renderExcel(data){
  const container=document.getElementById("excelTable");
  container.innerHTML="<h3>📊 Bảng phân ca</h3>";

  const structured={};

  Object.entries(data).forEach(([ten,obj])=>{
    Object.entries(obj.lich||{}).forEach(([day,shift])=>{
      structured[day]??=[];
      structured[day].push(`${ten} (${shift})`);
    });
  });

  Object.entries(structured).forEach(([day,list])=>{
    container.innerHTML+=`
      <div class="day">${day}</div>
      <div>${list.join(", ")}</div>
    `;
  });
}

/* CLEAR */
document.getElementById("clearBtn").onclick=async()=>{
  if(confirm("Xóa hết?")){
    await remove(ref(db,"dangKy"));
    location.reload();
  }
};
</script>

</body>
</html>
